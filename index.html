<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo sustituye --base-href al compilar (p. ej. /habitos/ en GitHub Pages). -->
  <base href="/habitos/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Registro de hábitos">
  <meta name="theme-color" content="#0F0F11">

  <!-- iPhone: «Añadir a pantalla de inicio» la abre a pantalla completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hábitos</title>
  <link rel="manifest" href="manifest.json">

  <!-- Se piden ya los dos archivos grandes, sin esperar al cargador. Safari
       usa el CanvasKit completo (no el de Chromium). -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #0F0F11; }
    /* Pantalla de carga: el icono respira hasta que se pinta la app. */
    #splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #0F0F11; transition: opacity .35s ease;
    }
    #splash img {
      width: 84px; height: 84px; border-radius: 22px;
      animation: breathe 1.6s ease-in-out infinite;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #gate { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; background: #0F0F11;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #f4f1ec; }
    #gate img { width: 72px; height: 72px; border-radius: 19px; }
    #gate input { width: min(280px, 76vw); box-sizing: border-box; padding: 14px 16px; font-size: 16px;
      border-radius: 16px; border: 1px solid #3a3a40; background: #1c1c1f; color: inherit; text-align: center; }
    #gate button { width: min(280px, 76vw); border: 0; border-radius: 26px; padding: 14px; font: inherit;
      font-weight: 800; font-size: 16px; background: #f7883e; color: #1c1c1e; }
    #gate p { margin: 0; min-height: 18px; font-size: 13px; color: #e5776b; }
    @keyframes breathe { 50% { transform: scale(.94); opacity: .7; } }
  </style>
</head>
<body>
  <div id="gate">
    <img src="icons/Icon-192.png" alt="">
    <input id="gpw" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="gbtn">Entrar</button>
    <p id="gerr"></p>
  </div>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    // Avisos push (iPhone con la app en la pantalla de inicio, iOS 16.4+).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('push-sw.js');
    }
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script>
    // Barrera ligera de acceso (solo web): se compara un hash SHA-256 y se
    // recuerda el desbloqueo en este dispositivo. No es seguridad real.
    (function () {
      var HASH = '01f2d0ba089250d88379b37540c9f1f6c2f46eb3d0b1b58339efd705a8ae459d';
      function load() {
        var g = document.getElementById('gate'); if (g) g.remove();
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js'; s.async = true;
        document.body.appendChild(s);
      }
      function sha(t) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode('habitos-web:' + t)).then(function (b) {
          return Array.from(new Uint8Array(b)).map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
        });
      }
      var ok = false;
      try { ok = localStorage.getItem('web.acceso') === HASH; } catch (_) {}
      if (ok) return load();
      document.getElementById('splash').style.display = 'none';
      var gate = document.getElementById('gate'); gate.style.display = 'flex';
      var inp = document.getElementById('gpw'), err = document.getElementById('gerr');
      function go() {
        sha(inp.value.trim()).then(function (h) {
          if (h === HASH) {
            try { localStorage.setItem('web.acceso', HASH); } catch (_) {}
            document.getElementById('splash').style.display = '';
            load();
          } else { err.textContent = 'Contraseña incorrecta'; inp.value = ''; }
        });
      }
      document.getElementById('gbtn').onclick = go;
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    })();
  </script>
</body>
</html>
