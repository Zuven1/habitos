<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo sustituye --base-href al compilar (p. ej. /habitos/ en GitHub Pages). -->
  <base href="/habitos/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Registro de hábitos">
  <meta name="theme-color" content="#0F0F11">

  <!-- iPhone: «Añadir a pantalla de inicio» la abre a pantalla completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hábitos</title>
  <link rel="manifest" href="manifest.json">

  <!-- Se piden ya los dos archivos grandes, sin esperar al cargador. Safari
       usa el CanvasKit completo (no el de Chromium). -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #0F0F11; }
    /* Pantalla de carga: el icono respira hasta que se pinta la app. */
    #splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #0F0F11; transition: opacity .35s ease;
    }
    #splash img {
      width: 84px; height: 84px; border-radius: 22px;
      animation: breathe 1.6s ease-in-out infinite;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    @keyframes breathe { 50% { transform: scale(.94); opacity: .7; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    // Avisos push (iPhone con la app en la pantalla de inicio, iOS 16.4+).
    // También guarda la app en el móvil para que abra al instante. Cuando
    // llega una versión nueva se recarga sola, sin que se note: al volver a
    // la app, o al instante si estaba en segundo plano.
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; }
        if (reloading) return;
        var go = function () { reloading = true; location.reload(); };
        if (document.hidden) { go(); return; }
        document.addEventListener('visibilitychange', function once() {
          if (document.hidden) { document.removeEventListener('visibilitychange', once); go(); }
        });
      });
      navigator.serviceWorker.register('push-sw.js').then(function (r) {
        // Mira si hay versión nueva cada vez que se vuelve a la app.
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) r.update().catch(function () {});
        });
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
