<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo sustituye --base-href al compilar (p. ej. /habitos/ en GitHub Pages). -->
  <base href="/habitos/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Registro de hábitos">
  <meta name="theme-color" content="#0F0F11">

  <!-- iPhone: «Añadir a pantalla de inicio» la abre a pantalla completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hábitos</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0F0F11; }
  </style>
</head>
<body>
  <script>
    // Avisos push (iPhone con la app en la pantalla de inicio, iOS 16.4+).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('push-sw.js');
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
