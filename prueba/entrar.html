<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar en Alop</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f0f11; color: #f4f1ec; }
  main { width: min(360px, 88vw); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #9a9aa2; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  button { width: 100%; border: 0; border-radius: 26px; padding: 15px; font: inherit; font-weight: 800;
    font-size: 16px; background: #f7883e; color: #1c1c1e; cursor: pointer; }
  small { display: block; margin-top: 18px; color: #6e6e73; font-size: 12.5px; line-height: 1.45; }
  @media (prefers-color-scheme: light) { body { background: #f4f2ee; color: #1c1c1e; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Entrar en Alop</h1>
  <p id="msg">Toca el botón para abrir la app con tu sesión iniciada.</p>
  <button id="go">Entrar</button>
  <small id="help">Si no se abre, vuelve al correo y escribe el código de 6 números en la app.</small>
</main>
<script>
  // Se pide un toque antes de gastar el enlace: así los programas del correo
  // que abren los enlaces por su cuenta no lo inutilizan.
  var PROJECT = 'https://vnhprujdrtwbxdcmopcc.supabase.co';
  var q = new URLSearchParams(location.search);
  var token = q.get('t') || '';
  var kind = q.get('k') === 'signup' ? 'signup' : 'magiclink';
  var android = /android/i.test(navigator.userAgent);
  var valid = /^[A-Za-z0-9_.\-]{16,200}$/.test(token);
  var button = document.getElementById('go');
  if (!valid) {
    document.getElementById('title').textContent = 'Enlace no válido';
    document.getElementById('msg').textContent = 'Pide otro código desde la app.';
    button.style.display = 'none';
  }
  // Si ya hay app, el enlace se abre en ella (con un intent explícito: vale
  // aunque Android aún no dé el dominio por verificado). #web = sin app.
  var noApp = location.hash === '#web';
  function openApp() {
    var here = location.host + location.pathname + location.search;
    var fallback = encodeURIComponent(location.href.split('#')[0] + '#web');
    location.href = 'intent://' + here + '#Intent;scheme=https;package=com.zuven.habitos;' +
      'S.browser_fallback_url=' + fallback + ';end';
  }
  button.addEventListener('click', function () {
    if (android && !noApp) { button.textContent = 'Abriendo…'; return openApp(); }
    // Sin app (o en otro sitio): se entra aquí y se vuelve a la app o a la web.
    var back = android ? 'com.zuven.habitos://login-callback' : 'https://zuven1.github.io/habitos/';
    button.textContent = 'Abriendo…';
    location.href = PROJECT + '/auth/v1/verify?token=' + encodeURIComponent(token) +
      '&type=' + kind + '&redirect_to=' + encodeURIComponent(back);
  });
  // En Android se intenta abrir la app sin esperar al toque (si el navegador
  // lo bloquea, queda el botón).
  if (valid && android && !noApp) openApp();
</script>
</body>
</html>
