<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo sustituye --base-href al compilar (p. ej. /habitos/ en GitHub Pages). -->
  <base href="/habitos/prueba/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Alop: hábitos, estudio y deporte con tus amigos">
  <meta name="theme-color" content="#0F0F11">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">

  <!-- iPhone: «Añadir a pantalla de inicio» la abre a pantalla completa,
       con este nombre y este icono. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alop">
  <meta name="application-name" content="Alop">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alop</title>
  <link rel="manifest" href="manifest.json">

  <!-- Se piden ya los archivos grandes, sin esperar al cargador. Safari
       usa el CanvasKit completo (no el de Chromium). -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Manrope-700.ttf" as="fetch" crossorigin>

  <style>
    html, body {
      margin: 0; height: 100%; background: #0F0F11; overflow: hidden;
      overscroll-behavior: none;
      /* Mantener el dedo nunca abre «Copiar / Pegar», la lupa ni la
         selección del iPhone (el juego Pulsa perdía partidas por eso). */
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    flutter-view, flt-glass-pane, flt-scene-host, flt-semantics-host, canvas {
      -webkit-touch-callout: none !important; -webkit-user-select: none !important;
      user-select: none !important;
    }
    /* Escribir sí: los campos de texto de la app. */
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text !important; user-select: text !important;
      -webkit-touch-callout: default !important;
    }
    .ui { font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #f4f1ec; }

    /* Carga: el gatito respira hasta que se pinta la app. */
    #splash {
      position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; gap: 18px;
      align-items: center; justify-content: center;
      background: #0F0F11; transition: opacity .4s ease;
    }
    #splash img {
      width: 92px; height: 92px; border-radius: 24px;
      box-shadow: 0 10px 40px rgba(247, 136, 62, .25);
      animation: breathe 1.8s ease-in-out infinite;
    }
    #splash b { font-size: 22px; font-weight: 800; letter-spacing: .5px; opacity: .92; }
    #splash i { width: 120px; height: 3px; border-radius: 3px; background: #26262b; overflow: hidden; position: relative; }
    #splash i::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px;
      background: #f7883e; animation: slide 1.2s ease-in-out infinite; }
    #splash.gone { opacity: 0; pointer-events: none; }
    @keyframes breathe { 50% { transform: scale(.94); opacity: .78; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

    #gate { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; background: #0F0F11; }
    #gate img { width: 76px; height: 76px; border-radius: 20px; }
    #gate h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
    #gate input { width: min(280px, 76vw); box-sizing: border-box; padding: 14px 16px; font-size: 16px;
      border-radius: 16px; border: 1px solid #3a3a40; background: #1c1c1f; color: inherit; text-align: center; }
    #gate button { width: min(280px, 76vw); border: 0; border-radius: 26px; padding: 14px; font: inherit;
      font-weight: 800; font-size: 16px; background: #f7883e; color: #1c1c1e; }
    #gate p { margin: 0; min-height: 18px; font-size: 13px; color: #e5776b; }

    /* «¿Añadir Alop a tu pantalla de inicio?» */
    #inst { position: fixed; inset: 0; z-index: 6; display: none; align-items: flex-end; justify-content: center;
      background: rgba(0, 0, 0, 0); transition: background .3s ease; }
    #inst.on { background: rgba(0, 0, 0, .45); }
    #inst .card { width: min(420px, 100%); box-sizing: border-box; margin: 0 10px calc(12px + env(safe-area-inset-bottom));
      padding: 22px 20px 18px; border-radius: 26px; background: #1a1a1e; border: 1px solid #2c2c32;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5); text-align: center;
      transform: translateY(120%); transition: transform .42s cubic-bezier(.2, .9, .25, 1.12); }
    #inst.on .card { transform: none; }
    #inst img { width: 64px; height: 64px; border-radius: 17px; }
    #inst h2 { margin: 12px 0 6px; font-size: 19px; font-weight: 800; }
    #inst p { margin: 0 0 16px; color: #a3a3ab; font-size: 14.5px; line-height: 1.45; }
    #inst .row { display: flex; gap: 10px; }
    #inst button { flex: 1; border: 0; border-radius: 22px; padding: 13px 10px; font: inherit; font-size: 15.5px;
      font-weight: 800; background: #2a2a30; color: #f4f1ec; }
    #inst button.go { background: #f7883e; color: #1c1c1e; }
    #inst ol { text-align: left; margin: 0 0 16px; padding: 0; list-style: none; counter-reset: s; }
    #inst li { counter-increment: s; display: flex; align-items: center; gap: 12px; padding: 9px 0;
      font-size: 15px; border-top: 1px solid #26262b; }
    #inst li:first-child { border-top: 0; }
    #inst li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 13px;
      background: rgba(247, 136, 62, .16); color: #f7883e; font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center; }
    #inst svg { width: 20px; height: 20px; vertical-align: -4px; color: #3d9bff; }
    #arrow { position: fixed; z-index: 7; left: 50%; bottom: calc(6px + env(safe-area-inset-bottom));
      margin-left: -15px; width: 30px; height: 30px; display: none; color: #f7883e;
      animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(8px); } }
    #inst.steps .card { margin-bottom: calc(52px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <div id="gate" class="ui">
    <img src="icons/Icon-192.png" alt="">
    <h1>Alop</h1>
    <input id="gpw" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="gbtn">Entrar</button>
    <p id="gerr"></p>
  </div>
  <div id="splash" class="ui"><img src="icons/Icon-192.png" alt=""><b>Alop</b><i></i></div>

  <div id="inst" class="ui" role="dialog" aria-modal="true">
    <div class="card">
      <img src="icons/Icon-192.png" alt="">
      <div id="ask">
        <h2>¿Añadir Alop a tu pantalla de inicio?</h2>
        <p>Se abrirá como una app: a pantalla completa, más rápida y con avisos.</p>
        <div class="row"><button id="no">Ahora no</button><button id="yes" class="go">Sí, añadir</button></div>
      </div>
      <div id="how" style="display:none">
        <h2>Así de fácil</h2>
        <ol>
          <li><span>Toca <b>Compartir</b> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> en la barra de Safari</span></li>
          <li><span>Elige <b>«Añadir a pantalla de inicio»</b></span></li>
          <li><span>Toca <b>Añadir</b>: ya tienes Alop con tu cuenta</span></li>
        </ol>
        <div class="row"><button id="ok" class="go">Entendido</button></div>
      </div>
    </div>
  </div>
  <svg id="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg>

  <script>
    // Enlace de un amigo (?amigo=CÓDIGO) en un Android con la app: se abre en
    // ella. #web = quedarse en la web (si no hay app, Chrome vuelve aquí).
    (function () {
      var q = new URLSearchParams(location.search);
      if (!q.get('amigo') || location.hash === '#web' || !/android/i.test(navigator.userAgent)) return;
      var here = location.host + location.pathname + location.search;
      var fb = encodeURIComponent(location.href.split('#')[0] + '#web');
      location.replace('intent://' + here + '#Intent;scheme=https;package=com.zuven.habitos;' +
        'S.browser_fallback_url=' + fb + ';end');
    })();
  </script>
  <script>
    // Ni menú de mantener pulsado ni selección fuera de los campos de texto.
    (function () {
      function editable(t) {
        return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      }
      document.addEventListener('contextmenu', function (e) { if (!editable(e.target)) e.preventDefault(); }, true);
      document.addEventListener('selectstart', function (e) { if (!editable(e.target)) e.preventDefault(); }, true);
      // Doble toque = zoom en Safari: fuera.
      document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
  <script>
    // Service worker: caché de la app (arranca al momento y sin red) y
    // avisos push (iPhone con la app en la pantalla de inicio, iOS 16.4+).
    var swReady = null;
    if ('serviceWorker' in navigator) {
      swReady = navigator.serviceWorker.register('push-sw.js').catch(function () { return null; });
    }
    // «Actualizar» de la app: trae el service worker nuevo (con su caché de
    // la versión nueva) y recarga cuando ya manda él.
    window.alopUpdate = function () {
      var reload = function () { location.reload(); };
      if (!swReady) return reload();
      swReady.then(function (reg) {
        if (!reg) return reload();
        var done = false;
        var finish = function () { if (!done) { done = true; reload(); } };
        navigator.serviceWorker.addEventListener('controllerchange', finish);
        setTimeout(finish, 20000);
        reg.update().then(function () {
          var w = reg.installing || reg.waiting;
          if (!w) return finish();
          w.addEventListener('statechange', function () { if (w.state === 'activated') finish(); });
        }, finish);
      });
    };
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 450);
      setTimeout(offerInstall, 4000);
    });

    // «¿Añadir a la pantalla de inicio?»: solo en el navegador (no en la app
    // ya añadida), una vez cada pocos días si dices «Ahora no».
    var installEvent = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvent = e; });
    function offerInstall() {
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (standalone || (!ios && !installEvent)) return;
      try {
        var later = +localStorage.getItem('web.instalarLuego') || 0;
        if (Date.now() < later) return;
      } catch (_) {}
      var box = document.getElementById('inst'), arrow = document.getElementById('arrow');
      box.style.display = 'flex';
      requestAnimationFrame(function () { requestAnimationFrame(function () { box.classList.add('on'); }); });
      function close(days) {
        try { localStorage.setItem('web.instalarLuego', String(Date.now() + days * 864e5)); } catch (_) {}
        box.classList.remove('on'); arrow.style.display = 'none';
        setTimeout(function () { box.style.display = 'none'; }, 420);
      }
      document.getElementById('no').onclick = function () { close(3); };
      document.getElementById('ok').onclick = function () { close(30); };
      document.getElementById('yes').onclick = function () {
        if (installEvent) {
          installEvent.prompt();
          installEvent.userChoice.then(function () { close(30); });
          installEvent = null;
          return;
        }
        document.getElementById('ask').style.display = 'none';
        document.getElementById('how').style.display = '';
        // En el iPhone «Compartir» está abajo, en el centro.
        if (/iPhone|iPod/.test(ua)) { box.classList.add('steps'); arrow.style.display = 'block'; }
      };
    }
  </script>
  <script>
    // Barrera ligera de acceso (solo web): se compara un hash SHA-256 y se
    // recuerda el desbloqueo en este dispositivo. No es seguridad real.
    (function () {
      var HASH = '01f2d0ba089250d88379b37540c9f1f6c2f46eb3d0b1b58339efd705a8ae459d';
      function load() {
        var g = document.getElementById('gate'); if (g) g.remove();
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js'; s.async = true;
        document.body.appendChild(s);
      }
      function sha(t) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode('habitos-web:' + t)).then(function (b) {
          return Array.from(new Uint8Array(b)).map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
        });
      }
      var ok = false;
      try { ok = localStorage.getItem('web.acceso') === HASH; } catch (_) {}
      if (ok) return load();
      document.getElementById('splash').style.display = 'none';
      var gate = document.getElementById('gate'); gate.style.display = 'flex';
      var inp = document.getElementById('gpw'), err = document.getElementById('gerr');
      function go() {
        sha(inp.value.trim()).then(function (h) {
          if (h === HASH) {
            try { localStorage.setItem('web.acceso', HASH); } catch (_) {}
            document.getElementById('splash').style.display = '';
            load();
          } else { err.textContent = 'Contraseña incorrecta'; inp.value = ''; }
        });
      }
      document.getElementById('gbtn').onclick = go;
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    })();
  </script>
</body>
</html>
